name: CurrentPulse History Repair

on:
  workflow_dispatch:
    inputs:
      from:
        description: "First India date to repair (YYYY-MM-DD)"
        required: true
        type: string
      to:
        description: "Last India date to repair, maximum 7 inclusive days"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: currentpulse-history-repair
  cancel-in-progress: false

env:
  CRON_SECRET: currentpulse-github-actions-history-runner
  NEXT_PUBLIC_BASE_URL: https://cp.vliab.workers.dev
  NEXT_PUBLIC_SITE_URL: https://cp.vliab.workers.dev
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
  CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
  SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_AI_API_TOKEN: ${{ secrets.CLOUDFLARE_AI_API_TOKEN }}
  CP_GH_MODELS_TOKEN: ${{ secrets.CP_GH_MODELS_TOKEN }}
  COVERAGE_SOURCE_TIMEOUT_MS: "45000"
  AI_ROUTER_DEADLINE_MS: "25000"
  AI_PROVIDER_TIMEOUT_MS: "15000"
  GEMINI_REQUEST_TIMEOUT_MS: "15000"

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4

      - name: Use Node 24 with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Validate repair window
        id: dates
        shell: bash
        env:
          HISTORY_FROM: ${{ inputs.from }}
          HISTORY_TO: ${{ inputs.to }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' > /tmp/currentpulse-history-dates
          import { enumerateHistoryDates } from "./lib/automation/history.js";
          const dates = enumerateHistoryDates(process.env.HISTORY_FROM, process.env.HISTORY_TO, 8);
          if (!dates.length || dates.length > 7 || dates.at(-1) !== process.env.HISTORY_TO) {
            throw new Error("Use a valid inclusive YYYY-MM-DD range of at most 7 days.");
          }
          process.stdout.write(dates.join("\n"));
          NODE
          echo "Repair dates:"
          sed 's/^/  - /' /tmp/currentpulse-history-dates

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Start private local Next server
        shell: bash
        run: |
          set -euo pipefail
          npm run dev -- --hostname 127.0.0.1 --port 3000 > /tmp/currentpulse-next.log 2>&1 &
          echo $! > /tmp/currentpulse-next.pid
          for attempt in {1..45}; do
            if curl --silent --fail --max-time 3 http://127.0.0.1:3000/icon.svg >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/currentpulse-next.log || true
          exit 1

      - name: Audit, repair and re-audit each date
        shell: bash
        env:
          HISTORY_FROM: ${{ inputs.from }}
          HISTORY_TO: ${{ inputs.to }}
        run: |
          set -euo pipefail
          mkdir -p history-repair-report

          call_api() {
            local path="$1"
            curl --silent --show-error --fail-with-body --max-time 240 \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              "http://127.0.0.1:3000${path}"
          }

          drain_lane() {
            local lane="$1"
            local budget="${2:-240}"
            local started processed outage response
            started="$(date +%s)"
            for batch in $(seq 1 40); do
              if (( $(date +%s) - started >= budget )); then
                echo "${lane} queue drain reached its safety budget."
                break
              fi
              response="$(call_api "/api/process-queue?wait=1&limit=2&pipeline=${lane}")"
              echo "${response}"
              processed="$(node -e 'const p=JSON.parse(process.argv[1]);process.stdout.write(String(p?.stats?.processed||0))' "${response}")"
              outage="$(node -e 'const p=JSON.parse(process.argv[1]);process.stdout.write(p?.stats?.providerOutage?"true":"false")' "${response}")"
              [[ "${processed}" != "0" ]] || break
              [[ "${outage}" != "true" ]] || break
            done
          }

          call_api "/api/history-audit?from=${HISTORY_FROM}&to=${HISTORY_TO}" \
            > history-repair-report/before.json

          while IFS= read -r history_date; do
            echo "===== Repair ${history_date} ====="
            call_api "/api/coverage-import?source=all&limit=2000&historyDate=${history_date}" \
              > "history-repair-report/${history_date}-coverage.json"
            drain_lane coverage 180
            for news_batch in $(seq 0 12); do
              news_report="history-repair-report/${history_date}-news-${news_batch}.json"
              call_api "/api/auto-publish?wait=1&scope=news&runner=github&historyDate=${history_date}&newsBatch=${news_batch}&newsBatchSize=6" \
                > "${news_report}"
              drain_lane news 75
              has_more="$(node -e 'const p=require("./"+process.argv[1]);process.stdout.write(p?.news?.selection?.hasMore?"true":"false")' "${news_report}")"
              [[ "${has_more}" == "true" ]] || break
            done
          done < /tmp/currentpulse-history-dates

          call_api "/api/history-audit?from=${HISTORY_FROM}&to=${HISTORY_TO}" \
            > history-repair-report/after.json

      - name: Upload before/after completeness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: currentpulse-history-${{ inputs.from }}-to-${{ inputs.to }}
          path: history-repair-report
          if-no-files-found: warn
          retention-days: 30

      - name: Print server log on failure
        if: failure()
        run: cat /tmp/currentpulse-next.log || true

      - name: Stop local Next server
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/currentpulse-next.pid ]]; then
            kill "$(cat /tmp/currentpulse-next.pid)" 2>/dev/null || true
          fi
