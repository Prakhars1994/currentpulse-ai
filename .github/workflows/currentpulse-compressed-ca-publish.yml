name: CurrentPulse Compressed CA Publish

on:
  push:
    branches: [main]
    paths:
      - "automation/publish-compressed/*.json"

permissions:
  contents: read
  actions: write

env:
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  GH_TOKEN: ${{ github.token }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4

      - name: Use Node 24 with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Decode and publish CA through existing quality gates
        run: node scripts/publish-currentpulse-compressed-queue.mjs

      - name: Queue durable reader refresh
        shell: bash
        run: |
          set -euo pipefail
          payload="$(node -e 'process.stdout.write(JSON.stringify([{entity_key:process.argv[1],stream:"coverage",status:"pending"}]))' "compressed-ca-${GITHUB_SHA}")"
          curl --silent --show-error --fail-with-body \
            "${NEXT_PUBLIC_SUPABASE_URL}/rest/v1/reader_release_requests" \
            -X POST \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            --data "${payload}"

      - name: Dispatch immediate full reader release
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run currentpulse-reader-release.yml \
            --ref main \
            -f reason=compressed-ca-publish \
            -f expected_sha="${GITHUB_SHA}" \
            -f full=true
