name: CurrentPulse Real Image Enrichment

on:
  push:
    paths:
      - ".github/workflows/currentpulse-image-enrichment.yml"
      - "lib/news/governmentImageResolver.js"
  workflow_dispatch:
    inputs:
      stream:
        description: "coverage for Current Affairs or news"
        required: true
        default: "coverage"
        type: choice
        options:
          - coverage
          - news
      limit:
        description: "Total articles to consider (1-40); processed in safe batches"
        required: true
        default: "40"
        type: string

permissions:
  contents: read

concurrency:
  group: currentpulse-real-image-enrichment
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve and persist reusable real images
        shell: bash
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          STREAM: ${{ inputs.stream || 'coverage' }}
          LIMIT: ${{ inputs.limit || '40' }}
        run: |
          set -euo pipefail
          [[ "${STREAM}" == "coverage" || "${STREAM}" == "news" ]] || { echo "Invalid stream"; exit 1; }
          [[ "${LIMIT}" =~ ^[0-9]+$ ]] || { echo "Invalid limit"; exit 1; }
          (( LIMIT >= 1 && LIMIT <= 40 )) || { echo "Limit must be 1..40"; exit 1; }
          remaining="${LIMIT}"
          while (( remaining > 0 )); do
            batch=8
            (( remaining < batch )) && batch="${remaining}"
            echo "Enriching ${STREAM}: batch=${batch}, remaining=${remaining}"
            response="$(curl --silent --show-error --fail-with-body --max-time 180 \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              "https://cp.vliab.workers.dev/api/backfill-images?stream=${STREAM}&limit=${batch}&wait=1")"
            echo "${response}"
            selected="$(printf '%s' "${response}" | jq -r '.stats.selected // 0')"
            (( selected == 0 )) && break
            remaining=$(( remaining - batch ))
            sleep 1
          done
