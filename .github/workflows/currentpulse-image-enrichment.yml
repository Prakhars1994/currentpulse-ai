name: CurrentPulse Real Image Enrichment

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      stream:
        description: "coverage, news, or all"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - coverage
          - news
      limit:
        description: "Maximum unresolved articles per stream in this run (1-40)"
        required: true
        default: "40"
        type: string

permissions:
  contents: read

concurrency:
  group: currentpulse-real-image-enrichment
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Resolve and persist reusable real images
        shell: bash
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          STREAM: ${{ inputs.stream || 'all' }}
          LIMIT: ${{ inputs.limit || '40' }}
        run: |
          set -euo pipefail
          [[ "${STREAM}" == "all" || "${STREAM}" == "coverage" || "${STREAM}" == "news" ]] || { echo "Invalid stream"; exit 1; }
          [[ "${LIMIT}" =~ ^[0-9]+$ ]] || { echo "Invalid limit"; exit 1; }
          (( LIMIT >= 1 && LIMIT <= 40 )) || { echo "Limit must be 1..40"; exit 1; }

          enrich_stream() {
            local stream="$1"
            local remaining="${LIMIT}"
            while (( remaining > 0 )); do
              local batch=8
              (( remaining < batch )) && batch="${remaining}"
              echo "Enriching ${stream}: batch=${batch}, remaining=${remaining}"
              response="$(curl --silent --show-error --fail-with-body --max-time 180 \
                -H "Authorization: Bearer ${CRON_SECRET}" \
                "https://cp.vliab.workers.dev/api/backfill-images?stream=${stream}&limit=${batch}&wait=1")"
              echo "${response}"
              selected="$(printf '%s' "${response}" | jq -r '.stats.selected // 0')"
              (( selected == 0 )) && break
              remaining=$(( remaining - batch ))
            done
          }

          if [[ "${STREAM}" == "all" || "${STREAM}" == "coverage" ]]; then enrich_stream coverage; fi
          if [[ "${STREAM}" == "all" || "${STREAM}" == "news" ]]; then enrich_stream news; fi
