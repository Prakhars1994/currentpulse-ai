name: CurrentPulse Quality & Freshness Maintenance

on:
  push:
    branches: [main]
  schedule:
    # 06:30, 12:30, 19:30 and 22:30 IST. This workflow intentionally does NOT
    # collect News/CA, so it cannot duplicate the external collection runners.
    - cron: "0 1,7,14,17 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: currentpulse-quality-maintenance
  cancel-in-progress: false

env:
  CRON_SECRET: currentpulse-github-actions-local-runner
  NEXT_PUBLIC_BASE_URL: https://cp.vliab.workers.dev
  NEXT_PUBLIC_SITE_URL: https://cp.vliab.workers.dev
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
  CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
  SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_AI_API_TOKEN: ${{ secrets.CLOUDFLARE_AI_API_TOKEN }}
  CP_GH_MODELS_TOKEN: ${{ secrets.CP_GH_MODELS_TOKEN }}
  AI_PROVIDER_ORDER: "mistral,cloudflare,groq,openrouter,cerebras,sambanova,githubmodels,huggingface"
  AI_ROUTER_DEADLINE_MS: "25000"
  AI_PROVIDER_TIMEOUT_MS: "15000"
  GEMINI_REQUEST_TIMEOUT_MS: "15000"

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Use Node 24 with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Validate Supabase secrets
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${NEXT_PUBLIC_SUPABASE_URL:-}" ]] || { echo "Missing NEXT_PUBLIC_SUPABASE_URL"; exit 1; }
          [[ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ]] || { echo "Missing SUPABASE_SERVICE_ROLE_KEY"; exit 1; }

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Start private local Next server
        shell: bash
        run: |
          set -euo pipefail
          npm run dev -- --hostname 127.0.0.1 --port 3000 > /tmp/currentpulse-maintenance.log 2>&1 &
          echo $! > /tmp/currentpulse-maintenance.pid
          for attempt in {1..45}; do
            if curl --silent --fail --max-time 3 http://127.0.0.1:3000/icon.svg >/dev/null; then
              echo "Maintenance server ready."
              exit 0
            fi
            sleep 2
          done
          cat /tmp/currentpulse-maintenance.log || true
          exit 1

      - name: Run ResultPulse, quiz and quality maintenance
        shell: bash
        run: |
          set -euo pipefail
          api_optional() {
            local path="$1"
            echo ">>> ${path}"
            if ! curl --silent --show-error --fail-with-body --max-time 300 \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              "http://127.0.0.1:3000${path}"; then
              echo
              echo "Optional maintenance task failed; other tasks continue."
            fi
            echo
          }

          india_hour="$(TZ=Asia/Kolkata date +%H)"
          echo "EVENT=${GITHUB_EVENT_NAME} INDIA_HOUR=${india_hour}"

          api_optional "/api/exams/run?notifications=0&runner=github-maintenance"

          # Every main push gets an immediate full repair/quiz pass so code and
          # public data are coherent as soon as the deployment lands.
          if [[ "${GITHUB_EVENT_NAME}" == "push" || "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            api_optional "/api/generate-quiz?wait=1&force=1"
            api_optional "/api/editorial-cleanup?apply=1&limit=3000&days=365"
            api_optional "/api/quality-repair?apply=1&limit=2000"
          elif [[ "${india_hour}" == "06" ]]; then
            api_optional "/api/generate-quiz?wait=1"
          elif [[ "${india_hour}" == "22" ]]; then
            api_optional "/api/generate-quiz?wait=1&force=1"
            api_optional "/api/editorial-cleanup?apply=1&limit=3000&days=365"
            api_optional "/api/quality-repair?apply=1&limit=2000"
          fi

      - name: Print server log on failure
        if: failure()
        shell: bash
        run: cat /tmp/currentpulse-maintenance.log || true

      - name: Stop local Next server
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/currentpulse-maintenance.pid ]]; then
            kill "$(cat /tmp/currentpulse-maintenance.pid)" 2>/dev/null || true
          fi

      - name: Deploy Cloudflare on main push
        if: github.event_name == 'push'
        continue-on-error: true
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -u
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "Cloudflare deployment credentials unavailable; local/other deployment remains authoritative."
            exit 0
          fi
          npm run deploy
