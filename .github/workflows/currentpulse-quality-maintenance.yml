name: CurrentPulse Quality & Freshness Maintenance

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: currentpulse-quality-maintenance
  cancel-in-progress: false

env:
  CRON_SECRET: currentpulse-github-actions-local-runner
  NEXT_PUBLIC_BASE_URL: https://cp.vliab.workers.dev
  NEXT_PUBLIC_SITE_URL: https://cp.vliab.workers.dev
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
  CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
  SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_AI_API_TOKEN: ${{ secrets.CLOUDFLARE_AI_API_TOKEN }}
  CP_GH_MODELS_TOKEN: ${{ secrets.CP_GH_MODELS_TOKEN }}
  AI_PROVIDER_ORDER: "mistral,cloudflare,groq,openrouter,cerebras,sambanova,githubmodels,huggingface"
  AI_ROUTER_DEADLINE_MS: "25000"
  AI_PROVIDER_TIMEOUT_MS: "15000"
  GEMINI_REQUEST_TIMEOUT_MS: "15000"

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Use Node 24 with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Validate Supabase secrets
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${NEXT_PUBLIC_SUPABASE_URL:-}" ]] || { echo "Missing NEXT_PUBLIC_SUPABASE_URL"; exit 1; }
          [[ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ]] || { echo "Missing SUPABASE_SERVICE_ROLE_KEY"; exit 1; }

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Restore validated runtime snapshot
        uses: actions/cache/restore@v4
        with:
          path: |
            .next
            .open-next
          key: currentpulse-runtime-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            currentpulse-release-${{ github.sha }}-

      - name: Capture public release state
        id: release-before
        shell: bash
        run: |
          set +e
          fingerprint="$(node scripts/public-release-state.mjs --fingerprint-only 2>/tmp/currentpulse-release-before.err)"
          status=$?
          set -e
          if [[ "${status}" -ne 0 || -z "${fingerprint}" ]]; then
            cat /tmp/currentpulse-release-before.err || true
            fingerprint="unknown-before-${GITHUB_RUN_ID}"
          fi
          echo "fingerprint=${fingerprint}" >> "${GITHUB_OUTPUT}"

      - name: Start private local Next server
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f .next/BUILD_ID ]]; then
            npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/currentpulse-maintenance.log 2>&1 &
          else
            npm run dev -- --hostname 127.0.0.1 --port 3000 > /tmp/currentpulse-maintenance.log 2>&1 &
          fi
          echo $! > /tmp/currentpulse-maintenance.pid
          for attempt in {1..45}; do
            if curl --silent --fail --max-time 3 http://127.0.0.1:3000/icon.svg >/dev/null; then
              echo "Maintenance server ready."
              exit 0
            fi
            sleep 2
          done
          cat /tmp/currentpulse-maintenance.log || true
          exit 1

      - name: Run ResultPulse, quiz and quality maintenance
        shell: bash
        run: |
          set -u
          : > /tmp/currentpulse-maintenance-degraded

          api_optional() {
            local label="$1"
            local path="$2"
            echo ">>> ${path}"
            if ! curl --silent --show-error --fail-with-body --max-time 300 \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              "http://127.0.0.1:3000${path}"; then
              echo
              echo "${label}" >> /tmp/currentpulse-maintenance-degraded
              echo "::warning title=CurrentPulse maintenance degraded::${label} failed; independent tasks continue."
            fi
            echo
          }

          india_hour="$(TZ=Asia/Kolkata date +%H)"
          echo "EVENT=${GITHUB_EVENT_NAME} INDIA_HOUR=${india_hour}"

          # ResultPulse remains GitHub-owned at its deliberate activity windows.
          api_optional "ResultPulse" "/api/exams/run?notifications=0&runner=github-maintenance"

          # Code pushes repair existing public rows but do NOT consume AI quota
          # by forcing a new daily quiz on every commit.
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            api_optional "Editorial cleanup" "/api/editorial-cleanup?apply=1&limit=120&days=365"
            api_optional "Quality repair" "/api/quality-repair?apply=1&limit=120"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            api_optional "Daily quiz" "/api/generate-quiz?wait=1&force=1"
            api_optional "Editorial cleanup" "/api/editorial-cleanup?apply=1&limit=120&days=365"
            api_optional "Quality repair" "/api/quality-repair?apply=1&limit=120"
          elif [[ "${india_hour}" == "06" ]]; then
            api_optional "Daily quiz" "/api/generate-quiz?wait=1"
          elif [[ "${india_hour}" == "22" ]]; then
            api_optional "Daily quiz" "/api/generate-quiz?wait=1&force=1"
            api_optional "Editorial cleanup" "/api/editorial-cleanup?apply=1&limit=120&days=365"
            api_optional "Quality repair" "/api/quality-repair?apply=1&limit=120"
          fi

      - name: Print server log on unexpected failure
        if: failure()
        shell: bash
        run: cat /tmp/currentpulse-maintenance.log || true

      - name: Stop local Next server
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/currentpulse-maintenance.pid ]]; then
            kill "$(cat /tmp/currentpulse-maintenance.pid)" 2>/dev/null || true
          fi

      - name: Assert maintenance health
        if: always()
        shell: bash
        run: |
          if [[ -s /tmp/currentpulse-maintenance-degraded ]]; then
            echo "::error title=CurrentPulse maintenance degraded::One or more requested maintenance tasks failed."
            echo "Failed tasks:"
            cat /tmp/currentpulse-maintenance-degraded
            exit 1
          fi
          echo "All requested maintenance tasks completed successfully."

      - name: Detect public content changes
        id: release-change
        if: always()
        shell: bash
        run: |
          set +e
          after="$(node scripts/public-release-state.mjs --fingerprint-only 2>/tmp/currentpulse-release-after.err)"
          status=$?
          set -e
          before="${{ steps.release-before.outputs.fingerprint }}"
          if [[ "${status}" -ne 0 || -z "${after}" ]]; then
            cat /tmp/currentpulse-release-after.err || true
            echo "changed=true" >> "${GITHUB_OUTPUT}"
            echo "Release-state check failed; fail-safe reader refresh requested."
          elif [[ "${before}" != "${after}" ]]; then
            echo "changed=true" >> "${GITHUB_OUTPUT}"
            echo "Public content changed: ${before} -> ${after}"
          else
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "No public content changed; no Cloudflare rebuild/deploy is required."
          fi

      - name: Request incremental reader release
        if: always() && steps.release-change.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run "currentpulse-reader-release.yml" \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            -f reason="content-${GITHUB_WORKFLOW}-${GITHUB_RUN_ID}" \
            -f expected_sha="${GITHUB_SHA}"
