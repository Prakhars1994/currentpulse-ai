name: CurrentPulse Production CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: currentpulse-production-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  NEXT_PUBLIC_BASE_URL: https://cp.vliab.workers.dev
  NEXT_PUBLIC_SITE_URL: https://cp.vliab.workers.dev
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Two commits are enough for the normal main push diff used by the
          # safe code-release planner. It falls back to a full reader release
          # whenever the previous commit cannot be inspected.
          fetch-depth: 2

      - name: Use Node 24 with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Validate build secrets
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${NEXT_PUBLIC_SUPABASE_URL:-}" ]] || { echo "Missing NEXT_PUBLIC_SUPABASE_URL"; exit 1; }
          [[ -n "${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}" ]] || { echo "Missing NEXT_PUBLIC_SUPABASE_ANON_KEY"; exit 1; }
          [[ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ]] || { echo "Missing SUPABASE_SERVICE_ROLE_KEY"; exit 1; }

      - name: Restore exact dependency tree
        id: dependency-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: currentpulse-node-modules-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Verify dependency cache
        if: steps.dependency-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          set -euo pipefail
          [[ -x node_modules/.bin/next ]] || { echo "Cached node_modules is incomplete; refusing deployment."; exit 1; }
          [[ -x node_modules/.bin/opennextjs-cloudflare ]] || { echo "Cached OpenNext CLI is incomplete; refusing deployment."; exit 1; }
          echo "Exact lockfile dependency cache restored; npm ci skipped."

      - name: Restore previous validated release assets
        id: previous-release-cache
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/cache/restore@v4
        with:
          path: |
            .next
            .open-next
          key: currentpulse-release-${{ github.sha }}-bootstrap
          restore-keys: |
            currentpulse-release-${{ github.sha }}-
            currentpulse-release-

      - name: Preserve previous static reader assets and safe build cache
        id: previous-assets
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/currentpulse-previous-assets /tmp/currentpulse-next-cache

          if [[ -d .open-next/assets ]] && find .open-next/assets -type f -print -quit | grep -q .; then
            mkdir -p /tmp/currentpulse-previous-assets
            cp -a .open-next/assets/. /tmp/currentpulse-previous-assets/
            echo "ready=true" >> "${GITHUB_OUTPUT}"
            echo "Previous validated reader assets preserved for a safe incremental release."
          else
            echo "ready=false" >> "${GITHUB_OUTPUT}"
            echo "No previous reader assets found; this release will regenerate the reader."
          fi

          # .next/cache is reusable compiler/build cache, not deployable output.
          # Preserve only that cache across builds; discard all prior generated
          # application output so stale pages or server bundles can never leak.
          if [[ -d .next/cache ]] && find .next/cache -type f -print -quit | grep -q .; then
            mkdir -p /tmp/currentpulse-next-cache
            cp -a .next/cache/. /tmp/currentpulse-next-cache/
          fi

          rm -rf .next .open-next

          if [[ -d /tmp/currentpulse-next-cache ]] && find /tmp/currentpulse-next-cache -type f -print -quit | grep -q .; then
            mkdir -p .next/cache
            cp -a /tmp/currentpulse-next-cache/. .next/cache/
            echo "Reusable Next build cache restored from the last validated release."
          fi

      - name: Full regression suite
        run: npm run test:regression

      - name: Build Cloudflare Worker
        run: npx opennextjs-cloudflare build

      - name: Check Cloudflare deploy readiness
        id: deploy-ready
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -n "${CLOUDFLARE_API_TOKEN:-}" && -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "ready=true" >> "${GITHUB_OUTPUT}"
          else
            echo "ready=false" >> "${GITHUB_OUTPUT}"
            echo "::warning title=Cloudflare deploy skipped::Build and regression tests passed, but CLOUDFLARE_API_TOKEN is not configured."
          fi

      - name: Start production reader renderer
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          npx next start --hostname 127.0.0.1 --port 3100 > /tmp/currentpulse-reader.log 2>&1 &
          echo $! > /tmp/currentpulse-reader.pid
          for attempt in {1..60}; do
            if curl --silent --fail --max-time 3 http://127.0.0.1:3100/icon.svg >/dev/null; then
              echo "Production reader renderer ready."
              exit 0
            fi
            sleep 2
          done
          cat /tmp/currentpulse-reader.log || true
          exit 1

      - name: Plan code-affected reader paths
        id: code-release-plan
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PREVIOUS_ASSETS_READY: ${{ steps.previous-assets.outputs.ready }}
        run: |
          set -euo pipefail
          rm -f /tmp/currentpulse-code-reader-paths.txt

          if [[ "${GITHUB_EVENT_NAME}" != "push" || "${PREVIOUS_ASSETS_READY:-false}" != "true" ]]; then
            echo "mode=full" >> "${GITHUB_OUTPUT}"
            echo "Full reader release required: no safe previous-asset baseline for this event."
            exit 0
          fi

          if node scripts/code-release-paths.mjs \
            --before "${BEFORE_SHA:-}" \
            --head "${GITHUB_SHA}" \
            --base http://127.0.0.1:3100 \
            --out /tmp/currentpulse-code-reader-paths.txt; then
            count="$(grep -cve '^[[:space:]]*$' /tmp/currentpulse-code-reader-paths.txt || true)"
            echo "mode=incremental" >> "${GITHUB_OUTPUT}"
            echo "Safe incremental code release contains ${count} explicit paths."
            sed 's/^/  /' /tmp/currentpulse-code-reader-paths.txt
          else
            echo "::warning title=Safe incremental fallback::Code impact could not be bounded; regenerating the full reader."
            rm -f /tmp/currentpulse-code-reader-paths.txt
            echo "mode=full" >> "${GITHUB_OUTPUT}"
          fi

      - name: Merge unchanged reader assets
        if: steps.code-release-plan.outputs.mode == 'incremental'
        shell: bash
        run: |
          set -euo pipefail
          [[ -d /tmp/currentpulse-previous-assets ]] || { echo "Previous asset snapshot missing."; exit 1; }
          mkdir -p .open-next/assets
          # Fresh OpenNext assets always win. Historical static HTML/chunks are
          # carried forward only for routes the impact planner proved unchanged.
          cp -a --update=none /tmp/currentpulse-previous-assets/. .open-next/assets/

      - name: Materialize static reader
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          RELEASE_MODE: ${{ steps.code-release-plan.outputs.mode }}
        run: |
          set -euo pipefail
          changed_args=()
          if [[ "${RELEASE_MODE}" == "incremental" ]]; then
            changed_args=(--changed-file /tmp/currentpulse-code-reader-paths.txt)
          fi

          echo "PRODUCTION_READER_RELEASE_MODE=${RELEASE_MODE:-full}"
          node scripts/materialize-static-reader.mjs \
            --base http://127.0.0.1:3100 \
            --out .open-next/assets \
            --max-pages 1200 \
            --concurrency 4 \
            --timeout-ms 10000 \
            --budget-seconds 720 \
            "${changed_args[@]}"

      - name: Build static sitemap index and shards
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: node scripts/build-static-sitemaps.mjs --out .open-next/assets

      - name: Stop production reader renderer
        if: always() && steps.deploy-ready.outputs.ready == 'true'
        shell: bash
        run: |
          if [[ -f /tmp/currentpulse-reader.pid ]]; then
            kill "$(cat /tmp/currentpulse-reader.pid)" 2>/dev/null || true
          fi

      - name: Validate Cloudflare deploy credentials
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]] || {
            echo "::error title=Cloudflare deploy blocked::Add repository secret CLOUDFLARE_API_TOKEN."
            exit 1
          }
          [[ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]] || {
            echo "::error title=Cloudflare deploy blocked::Add repository secret CLOUDFLARE_ACCOUNT_ID."
            exit 1
          }

      - name: Deploy the validated Worker build
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.jsonc

      - name: Production smoke test
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          base="https://cp.vliab.workers.dev"
          for path in / /robots.txt /sitemap.xml /news-sitemap.xml /current-affairs /news /exams /quiz /feed.xml; do
            echo "Checking ${base}${path}"
            curl --silent --show-error --fail --location \
              --retry 3 --retry-delay 2 --max-time 60 \
              "${base}${path}" >/dev/null
          done
          echo "Production smoke test passed."

      # PDF publication already performs bounded, persist-once image enrichment.
      # Do not trigger historical external-provider searches on every code deploy.

      - name: Save validated release snapshot
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/cache/save@v4
        with:
          path: |
            .next
            .open-next
          key: currentpulse-release-${{ github.sha }}-${{ github.run_id }}
