name: CurrentPulse Production CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: currentpulse-production-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  NEXT_PUBLIC_BASE_URL: https://cp.vliab.workers.dev
  NEXT_PUBLIC_SITE_URL: https://cp.vliab.workers.dev
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Use Node 24 with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Validate build secrets
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${NEXT_PUBLIC_SUPABASE_URL:-}" ]] || { echo "Missing NEXT_PUBLIC_SUPABASE_URL"; exit 1; }
          [[ -n "${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}" ]] || { echo "Missing NEXT_PUBLIC_SUPABASE_ANON_KEY"; exit 1; }
          [[ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ]] || { echo "Missing SUPABASE_SERVICE_ROLE_KEY"; exit 1; }

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Full regression suite
        run: npm run test:regression

      - name: Build Cloudflare Worker
        run: npx opennextjs-cloudflare build

      - name: Check Cloudflare deploy readiness
        id: deploy-ready
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -n "${CLOUDFLARE_API_TOKEN:-}" && -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "ready=true" >> "${GITHUB_OUTPUT}"
          else
            echo "ready=false" >> "${GITHUB_OUTPUT}"
            echo "::warning title=Cloudflare deploy skipped::Build and regression tests passed, but CLOUDFLARE_API_TOKEN is not configured."
          fi

      - name: Start production reader renderer
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          npx next start --hostname 127.0.0.1 --port 3100 > /tmp/currentpulse-reader.log 2>&1 &
          echo $! > /tmp/currentpulse-reader.pid
          for attempt in {1..60}; do
            if curl --silent --fail --max-time 3 http://127.0.0.1:3100/icon.svg >/dev/null; then
              echo "Production reader renderer ready."
              exit 0
            fi
            sleep 2
          done
          cat /tmp/currentpulse-reader.log || true
          exit 1

      - name: Materialize static reader
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: node scripts/materialize-static-reader.mjs --base http://127.0.0.1:3100 --out .open-next/assets --max-pages 1200 --concurrency 3 --timeout-ms 10000 --budget-seconds 720

      - name: Build static sitemap index and shards
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: node scripts/build-static-sitemaps.mjs --out .open-next/assets

      - name: Stop production reader renderer
        if: always() && steps.deploy-ready.outputs.ready == 'true'
        shell: bash
        run: |
          if [[ -f /tmp/currentpulse-reader.pid ]]; then
            kill "$(cat /tmp/currentpulse-reader.pid)" 2>/dev/null || true
          fi

      - name: Validate Cloudflare deploy credentials
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]] || {
            echo "::error title=Cloudflare deploy blocked::Add repository secret CLOUDFLARE_API_TOKEN."
            exit 1
          }
          [[ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]] || {
            echo "::error title=Cloudflare deploy blocked::Add repository secret CLOUDFLARE_ACCOUNT_ID."
            exit 1
          }

      - name: Deploy the validated Worker build
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.jsonc

      - name: Production smoke test
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          base="https://cp.vliab.workers.dev"
          for path in / /robots.txt /sitemap.xml /news-sitemap.xml /current-affairs /news /exams /quiz /feed.xml; do
            echo "Checking ${base}${path}"
            curl --silent --show-error --fail --location \
              --retry 3 --retry-delay 2 --max-time 60 \
              "${base}${path}" >/dev/null
          done
          echo "Production smoke test passed."

      # PDF publication already performs bounded, persist-once image enrichment.
      # Do not trigger historical external-provider searches on every code deploy.

      - name: Save validated release snapshot
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/cache/save@v4
        with:
          path: |
            .next
            .open-next
          key: currentpulse-release-${{ github.sha }}-${{ github.run_id }}
