name: CurrentPulse Production CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: currentpulse-production-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  NEXT_PUBLIC_BASE_URL: https://cp.vliab.workers.dev
  NEXT_PUBLIC_SITE_URL: https://cp.vliab.workers.dev
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Use Node 24 with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Validate build secrets
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${NEXT_PUBLIC_SUPABASE_URL:-}" ]] || { echo "Missing NEXT_PUBLIC_SUPABASE_URL"; exit 1; }
          [[ -n "${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}" ]] || { echo "Missing NEXT_PUBLIC_SUPABASE_ANON_KEY"; exit 1; }
          [[ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ]] || { echo "Missing SUPABASE_SERVICE_ROLE_KEY"; exit 1; }

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Editorial regression tests
        run: npm run test:editorial

      - name: Automation regression tests
        run: npm run test:automation

      - name: Quality, map and architecture regression tests
        run: node --test tests/article-quality.test.mjs tests/map-relevance.test.mjs tests/taxonomy-authority.test.mjs tests/taxonomy-regression.test.mjs tests/workflow-architecture.test.mjs tests/cloudflare-public-routes.test.mjs

      - name: Build Cloudflare Worker
        run: npx opennextjs-cloudflare build

      - name: Validate Cloudflare deploy credentials
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]] || {
            echo "::error title=Cloudflare deploy blocked::Add repository secret CLOUDFLARE_API_TOKEN."
            exit 1
          }
          [[ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]] || {
            echo "::error title=Cloudflare deploy blocked::Add repository secret CLOUDFLARE_ACCOUNT_ID."
            exit 1
          }

      - name: Deploy the validated Worker build
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx opennextjs-cloudflare deploy

      - name: Production smoke test
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          base="https://cp.vliab.workers.dev"
          for path in / /robots.txt /sitemap.xml /news-sitemap.xml /current-affairs /news /exams /quiz /feed.xml; do
            echo "Checking ${base}${path}"
            curl --silent --show-error --fail --location \
              --retry 3 --retry-delay 2 --max-time 60 \
              "${base}${path}" >/dev/null
          done
          echo "Production smoke test passed."
