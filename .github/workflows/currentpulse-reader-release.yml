name: CurrentPulse Incremental Reader Release

on:
  push:
    branches: [main]
    paths:
      - "wrangler.jsonc"
      - ".github/workflows/currentpulse-reader-release.yml"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: "Why the public reader needs refreshing"
        required: false
        default: "content-change"
        type: string
      expected_sha:
        description: "Commit that produced the content mutation"
        required: false
        default: ""
        type: string
      full:
        description: "Force full reader regeneration"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: currentpulse-reader-release
  # Every successful run advances a durable database watermark. Cancelling an
  # older valid release can otherwise lose the only refresh for its mutation.
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: "1"
  NEXT_PUBLIC_BASE_URL: https://cp.vliab.workers.dev
  NEXT_PUBLIC_SITE_URL: https://cp.vliab.workers.dev
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.pending.outputs.release }}
      max_id: ${{ steps.pending.outputs.max_id }}
    steps:
      - name: Check durable release outbox
        id: pending
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          [[ -n "${SUPABASE_URL:-}" && -n "${SERVICE_KEY:-}" ]] || { echo "Missing Supabase release secrets"; exit 1; }
          response="$(curl --silent --show-error --fail-with-body \
            "${SUPABASE_URL}/rest/v1/reader_release_requests?select=id&status=eq.pending&order=id.desc&limit=1" \
            -H "apikey: ${SERVICE_KEY}" -H "Authorization: Bearer ${SERVICE_KEY}")"
          max_id="$(node -e 'const rows=JSON.parse(process.argv[1]);process.stdout.write(rows[0]?.id?String(rows[0].id):"")' "${response}")"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" || "${GITHUB_EVENT_NAME}" == "push" || -n "${max_id}" ]]; then echo "release=true" >> "${GITHUB_OUTPUT}"; else echo "release=false" >> "${GITHUB_OUTPUT}"; fi
          echo "max_id=${max_id}" >> "${GITHUB_OUTPUT}"

  release:
    needs: preflight
    if: needs.preflight.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Use Node 24 with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Validate release secrets
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${NEXT_PUBLIC_SUPABASE_URL:-}" ]] || { echo "Missing NEXT_PUBLIC_SUPABASE_URL"; exit 1; }
          [[ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ]] || { echo "Missing SUPABASE_SERVICE_ROLE_KEY"; exit 1; }
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]] || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          [[ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]] || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          if [[ -n "${{ inputs.expected_sha }}" && "${{ inputs.expected_sha }}" != "${GITHUB_SHA}" ]]; then
            echo "Requested commit ${{ inputs.expected_sha }} is no longer current; releasing current main ${GITHUB_SHA} instead."
          fi

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Restore validated release snapshot
        id: release-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .next
            .open-next
          key: currentpulse-release-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            currentpulse-release-${{ github.sha }}-

      - name: Inspect restored release
        id: restored
        shell: bash
        run: |
          if [[ -f .next/BUILD_ID && -f .open-next/worker.js ]]; then
            echo "ready=true" >> "${GITHUB_OUTPUT}"
            echo "Validated build snapshot restored; skipping OpenNext rebuild."
          else
            echo "ready=false" >> "${GITHUB_OUTPUT}"
            echo "No validated snapshot for this commit; one fallback build is required."
          fi

      - name: Fallback build only when cache is missing
        if: steps.restored.outputs.ready != 'true'
        run: npx opennextjs-cloudflare build

      - name: Start reader renderer
        shell: bash
        run: |
          set -euo pipefail
          npx next start --hostname 127.0.0.1 --port 3100 > /tmp/currentpulse-reader.log 2>&1 &
          echo $! > /tmp/currentpulse-reader.pid
          for attempt in {1..60}; do
            if curl --silent --fail --max-time 3 http://127.0.0.1:3100/icon.svg >/dev/null; then
              echo "Reader renderer ready."
              exit 0
            fi
            sleep 2
          done
          cat /tmp/currentpulse-reader.log || true
          exit 1

      - name: Plan exact incremental reader paths
        id: release-plan
        shell: bash
        env:
          FULL_RELEASE: ${{ inputs.full }}
        run: |
          set -euo pipefail

          if [[ "${FULL_RELEASE}" == "true" ]]; then
            echo "mode=full" >> "${GITHUB_OUTPUT}"
            echo "Manual full reader release requested."
            exit 0
          fi

          manifest="/tmp/currentpulse-live-reader-manifest.json"

          if ! curl --silent --show-error --fail --location \
            --retry 2 --retry-delay 2 --max-time 30 \
            "https://cp.vliab.workers.dev/currentpulse-static-reader-manifest.json" \
            --output "${manifest}"; then
            echo "::warning title=Incremental reader fallback::Could not load the last deployed reader manifest; using a full release."
            echo "mode=full" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          since="$(
            node -e '
              const fs=require("fs");
              try {
                const p=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
                process.stdout.write(String(p?.generatedAt || ""));
              } catch {}
            ' "${manifest}"
          )"

          if [[ -z "${since}" ]]; then
            echo "::warning title=Incremental reader fallback::Deployed reader manifest has no valid watermark; using a full release."
            echo "mode=full" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if node scripts/public-release-paths.mjs \
            --since "${since}" \
            --out /tmp/currentpulse-reader-paths.txt; then

            count="$(grep -cve '^[[:space:]]*$' /tmp/currentpulse-reader-paths.txt || true)"
            echo "mode=incremental" >> "${GITHUB_OUTPUT}"
            echo "Incremental reader plan contains ${count} explicit paths."
            sed 's/^/  /' /tmp/currentpulse-reader-paths.txt
          else
            echo "::warning title=Incremental reader fallback::Changed-path planning could not prove a bounded safe release; using a full release."
            rm -f /tmp/currentpulse-reader-paths.txt
            echo "mode=full" >> "${GITHUB_OUTPUT}"
          fi

      - name: Refresh reader pages
        shell: bash
        env:
          RELEASE_MODE: ${{ steps.release-plan.outputs.mode }}
        run: |
          set -euo pipefail

          reuse_local=0
          changed_args=()

          if [[ "${RELEASE_MODE}" == "incremental" ]]; then
            reuse_local=1
            changed_args=(--changed-file /tmp/currentpulse-reader-paths.txt)
          fi

          echo "READER_RELEASE_MODE=${RELEASE_MODE}"

          node scripts/materialize-static-reader.mjs \
            --base http://127.0.0.1:3100 \
            --reuse-base https://cp.vliab.workers.dev \
            --reuse-local "${reuse_local}" \
            --fresh-days 3 \
            --out .open-next/assets \
            --max-pages 1200 \
            --concurrency 3 \
            --timeout-ms 10000 \
            --budget-seconds 720 \
            "${changed_args[@]}"

      - name: Stop reader renderer
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/currentpulse-reader.pid ]]; then
            kill "$(cat /tmp/currentpulse-reader.pid)" 2>/dev/null || true
          fi

      - name: Deploy refreshed reader
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.jsonc

      - name: Verify refreshed reader
        shell: bash
        run: |
          set -euo pipefail
          base="https://cp.vliab.workers.dev"
          for path in / /current-affairs /news /exams /quiz /feed.xml /currentpulse-static-reader-manifest.json; do
            echo "Checking ${base}${path}"
            curl --silent --show-error --fail --location --retry 3 --retry-delay 2 --max-time 60 "${base}${path}" >/dev/null
          done
          echo "Incremental public reader release passed."

      - name: Complete durable release requests
        if: success() && needs.preflight.outputs.max_id != ''
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MAX_RELEASE_ID: ${{ needs.preflight.outputs.max_id }}
        run: |
          set -euo pipefail
          completed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          curl --silent --show-error --fail-with-body --request PATCH \
            "${SUPABASE_URL}/rest/v1/reader_release_requests?status=eq.pending&id=lte.${MAX_RELEASE_ID}" \
            -H "apikey: ${SERVICE_KEY}" -H "Authorization: Bearer ${SERVICE_KEY}" \
            -H "Content-Type: application/json" -H "Prefer: return=minimal" \
            --data "{\"status\":\"completed\",\"completed_at\":\"${completed_at}\",\"updated_at\":\"${completed_at}\"}"

      - name: Save refreshed release snapshot
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            .next
            .open-next
          key: currentpulse-release-${{ github.sha }}-${{ github.run_id }}
