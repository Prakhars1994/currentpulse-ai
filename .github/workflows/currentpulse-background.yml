name: CurrentPulse Background Automation

on:
  schedule:
    # Six lightweight daily runs in IST:
    # 06:30, 09:30, 12:30, 15:30, 19:30 and 22:30.
    # GitHub cron uses UTC: 01:00, 04:00, 07:00, 10:00, 14:00 and 17:00.
    # News runs every slot; CA is concentrated in evening publication windows.
    - cron: "0 1,4,7,10,14,17 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Automation task to run"
        required: true
        default: "smart"
        type: choice
        options:
          - smart
          - collect
          - news
          - coverage
          - queue
          - exams

permissions:
  contents: read

concurrency:
  group: currentpulse-background-automation
  cancel-in-progress: false

env:
  # The Next server exists only inside this ephemeral GitHub runner, so this
  # local secret does not need to match the public site's CRON_SECRET.
  CRON_SECRET: currentpulse-github-actions-local-runner
  NEXT_PUBLIC_BASE_URL: https://currentpulse-ai.vercel.app

  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
  CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
  SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_AI_API_TOKEN: ${{ secrets.CLOUDFLARE_AI_API_TOKEN }}
  CP_GH_MODELS_TOKEN: ${{ secrets.CP_GH_MODELS_TOKEN }}

  RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
  RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
  WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
  WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
  WHATSAPP_TEMPLATE_NAME: ${{ secrets.WHATSAPP_TEMPLATE_NAME }}
  WHATSAPP_TEMPLATE_LANGUAGE: ${{ secrets.WHATSAPP_TEMPLATE_LANGUAGE }}

  # Keep source work bounded even though the public-repository runner is free.
  NEWS_SUPPLEMENTAL_SOURCES_PER_RUN: "4"
  NEWS_MAX_QUEUE_WRITES_PER_RUN: "24"
  COVERAGE_SOURCES_PER_RUN: "3"

  # Trusted coaching CA is processed immediately. The queue is only fallback.
  COVERAGE_IMMEDIATE_MAX_PER_RUN: "10"
  COVERAGE_IMMEDIATE_PUBLISH_BUDGET_MS: "150000"

  # Fast sequential provider fallback conserves free quotas instead of racing
  # every provider at once.
  AI_PROVIDER_ORDER: "mistral,cloudflare,groq,openrouter,cerebras,sambanova,githubmodels,huggingface"
  AI_ROUTER_DEADLINE_MS: "50000"
  AI_PROVIDER_TIMEOUT_MS: "15000"
  GEMINI_REQUEST_TIMEOUT_MS: "8000"

  EXAM_SOURCES_PER_RUN: "5"
  EXAM_ITEMS_PER_SOURCE: "50"

jobs:
  automate:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.AUTOMATION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Use Node 24 with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${NEXT_PUBLIC_SUPABASE_URL:-}" ]]; then
            echo "Missing GitHub Actions secret: NEXT_PUBLIC_SUPABASE_URL"
            exit 1
          fi
          if [[ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]]; then
            echo "Missing GitHub Actions secret: SUPABASE_SERVICE_ROLE_KEY"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Start private local Next server
        shell: bash
        run: |
          set -euo pipefail
          npm run dev -- --hostname 127.0.0.1 --port 3000 > /tmp/currentpulse-next.log 2>&1 &
          echo $! > /tmp/currentpulse-next.pid

          for attempt in {1..45}; do
            if curl --silent --fail --max-time 3 http://127.0.0.1:3000/icon.svg >/dev/null; then
              echo "CurrentPulse local automation server is ready."
              exit 0
            fi
            sleep 2
          done

          echo "Local Next server did not become ready."
          cat /tmp/currentpulse-next.log || true
          exit 1

      - name: Run quota-bounded automation
        shell: bash
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          MANUAL_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail

          api() {
            local path="$1"
            echo "Calling ${path}"
            curl --silent --show-error --fail-with-body \
              --max-time 240 \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              "http://127.0.0.1:3000${path}"
            echo
          }

          mode="${MANUAL_MODE:-}"
          if [[ -z "$mode" || "$mode" == "smart" ]]; then
            if [[ -n "${EVENT_SCHEDULE:-}" ]]; then
              mode="smart-scheduled"
            else
              mode="smart-full"
            fi
          fi

          case "$mode" in
            collect)
              api "/api/auto-publish?wait=1&scope=news"
              api "/api/coverage-import?source=all&limit=180"
              ;;
            news)
              api "/api/auto-publish?wait=1&scope=news"
              ;;
            coverage)
              api "/api/coverage-import?source=all&limit=180"
              ;;
            queue)
              api "/api/process-queue?wait=1&limit=6"
              ;;
            exams)
              api "/api/exams/run?full=1&notifications=0"
              ;;
            smart-full)
              # Manual catch-up scans the complete News source catalogue.
              api "/api/auto-publish?wait=1&scope=news&full=1"

              # All trusted coaching sources. New CA is published immediately;
              # only temporary AI/errors are left in the queue.
              api "/api/coverage-import?source=all&limit=180"

              # Clear fresh News and any CA fallbacks in bounded batches.
              for batch in 1 2 3; do
                api "/api/process-queue?wait=1&limit=6"
              done

              api "/api/exams/run?full=1&notifications=0"
              api "/api/generate-quiz?wait=1&force=1"
              ;;
            smart-scheduled)
              india_hour="$(TZ=Asia/Kolkata date +%H)"

              api "/api/auto-publish?wait=1&scope=news"

              # Coaching Current Affairs is scanned in two evening batches.
              # With three rotating sources per run this covers the six trusted
              # coaching sources daily without repeatedly scraping them all day.
              if [[ "$india_hour" == "19" || "$india_hour" == "22" ]]; then
                api "/api/auto-publish?wait=1&scope=coverage"
              fi

              api "/api/process-queue?wait=1&limit=6"

              # ResultPulse gets several activity windows without blanket
              # half-hourly polling.
              case "$india_hour" in
                06|12|19|22)
                  api "/api/exams/run?notifications=0"
                  ;;
              esac

              # One fresh UPSC quiz attempt each morning.
              if [[ "$india_hour" == "06" ]]; then
                api "/api/generate-quiz?wait=1"
              fi
              ;;
            *)
              echo "Unsupported automation mode: $mode"
              exit 2
              ;;
          esac

      - name: Print server log on failure
        if: failure()
        shell: bash
        run: cat /tmp/currentpulse-next.log || true

      - name: Stop local Next server
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/currentpulse-next.pid ]]; then
            kill "$(cat /tmp/currentpulse-next.pid)" 2>/dev/null || true
          fi
