name: CurrentPulse Background Automation

# GitHub Actions is the single heavy scheduler for News, Current Affairs,
# ResultPulse, queue processing and the static-reader release. Existing external
# cron-job.org calls remain compatibility heartbeats only and are intentionally
# skipped by the production APIs so expensive work cannot run twice.
on:
  schedule:
    # 06:30, 09:30, 12:30, 15:30, 19:30, 22:30 and 23:30 IST.
    - cron: "0 1,4,7,10,14,17,18 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Automation task to run"
        required: true
        default: "smart"
        type: choice
        options:
          - smart
          - collect
          - news
          - news-catchup
          - news-repair
          - coverage
          - queue
          - exams

permissions:
  contents: read

concurrency:
  group: currentpulse-background-automation
  cancel-in-progress: false

env:
  CRON_SECRET: currentpulse-github-actions-local-runner
  NEXT_PUBLIC_BASE_URL: https://cp.vliab.workers.dev
  NEXT_PUBLIC_SITE_URL: https://cp.vliab.workers.dev

  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
  CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
  SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_AI_API_TOKEN: ${{ secrets.CLOUDFLARE_AI_API_TOKEN }}
  CP_GH_MODELS_TOKEN: ${{ secrets.CP_GH_MODELS_TOKEN }}

  RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
  RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
  WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
  WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
  WHATSAPP_TEMPLATE_NAME: ${{ secrets.WHATSAPP_TEMPLATE_NAME }}
  WHATSAPP_TEMPLATE_LANGUAGE: ${{ secrets.WHATSAPP_TEMPLATE_LANGUAGE }}

  NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}

  NEWS_CORE_SOURCES_PER_RUN: "4"
  NEWS_SUPPLEMENTAL_SOURCES_PER_RUN: "2"
  NEWS_FETCH_TIMEOUT_MS: "15000"
  NEWS_SOURCE_FETCH_CONCURRENCY: "2"
  NEWS_PUBLISH_CONCURRENCY: "6"
  NEWS_ENRICHMENT_DEADLINE_MS: "12000"
  AI_AUTOMATION_SOURCE_CHAR_LIMIT: "14000"

  # The 7 approved coaching sources are covered by two complementary 4-source
  # windows. The direct inline cap is NOT the total publish cap: the
  # queue is drained repeatedly immediately after collection.
  COVERAGE_SOURCES_PER_RUN: "4"
  COVERAGE_SOURCE_TIMEOUT_MS: "45000"

  AI_PROVIDER_ORDER: "mistral,cloudflare,groq,openrouter,cerebras,sambanova,githubmodels,huggingface"
  AI_ROUTER_DEADLINE_MS: "25000"
  AI_PROVIDER_TIMEOUT_MS: "15000"
  GEMINI_REQUEST_TIMEOUT_MS: "15000"

  EXAM_SOURCES_PER_RUN: "6"
  EXAM_ITEMS_PER_SOURCE: "50"

jobs:
  automate:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Use Node 24 with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${NEXT_PUBLIC_SUPABASE_URL:-}" ]] || { echo "Missing NEXT_PUBLIC_SUPABASE_URL"; exit 1; }
          [[ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ]] || { echo "Missing SUPABASE_SERVICE_ROLE_KEY"; exit 1; }

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Start private local Next server
        shell: bash
        run: |
          set -euo pipefail
          npm run dev -- --hostname 127.0.0.1 --port 3000 > /tmp/currentpulse-next.log 2>&1 &
          echo $! > /tmp/currentpulse-next.pid

          for attempt in {1..45}; do
            if curl --silent --fail --max-time 3 http://127.0.0.1:3000/icon.svg >/dev/null; then
              echo "CurrentPulse automation server ready."
              exit 0
            fi
            sleep 2
          done

          cat /tmp/currentpulse-next.log || true
          exit 1

      - name: Run CurrentPulse automation
        shell: bash
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          MANUAL_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail

          api_required() {
            local path="$1"
            echo
            echo ">>> ${path}"
            curl --silent --show-error --fail-with-body --max-time 900 \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              "http://127.0.0.1:3000${path}"
            echo
          }

          api_optional() {
            local path="$1"
            echo
            echo ">>> OPTIONAL ${path}"
            if ! curl --silent --show-error --fail-with-body --max-time 900 \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              "http://127.0.0.1:3000${path}"; then
              echo
              echo "Optional task failed; independent pipelines will continue."
              return 0
            fi
            echo
          }

          drain_queue() {
            local max_seconds="${1:-300}"
            local pipeline="${2:-mixed}"
            local started batch tmp code curl_status processed outage
            started="$(date +%s)"
            echo
            echo "===== DRAIN READY QUEUE (${max_seconds}s budget) ====="

            for batch in $(seq 1 60); do
              if (( $(date +%s) - started >= max_seconds )); then
                echo "Queue drain reached its safety budget."
                break
              fi

              tmp="$(mktemp)"
              set +e
              code="$(
                curl --silent --show-error --max-time 135 \
                  --output "${tmp}" \
                  --write-out "%{http_code}" \
                  -H "Authorization: Bearer ${CRON_SECRET}" \
                  "http://127.0.0.1:3000/api/process-queue?wait=1&limit=2&pipeline=${pipeline}"
              )"
              curl_status=$?
              set -e

              cat "${tmp}" || true
              echo

              if [[ "${curl_status}" -ne 0 ]]; then
                rm -f "${tmp}"
                echo "Queue processor request timed out/failed; rows remain durable for the next hourly retry."
                break
              fi

              if [[ "${code}" -lt 200 || "${code}" -ge 300 ]]; then
                rm -f "${tmp}"
                echo "Queue processor HTTP ${code}; rows remain durable for the next hourly retry."
                break
              fi

              processed="$(
                node -e '
                  const fs=require("fs");
                  const p=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
                  process.stdout.write(String(p?.stats?.processed || 0));
                ' "${tmp}"
              )"
              outage="$(
                node -e '
                  const fs=require("fs");
                  const p=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
                  process.stdout.write(p?.stats?.providerOutage ? "true" : "false");
                ' "${tmp}"
              )"
              rm -f "${tmp}"

              echo "QUEUE_BATCH=${batch} PROCESSED=${processed} PROVIDER_OUTAGE=${outage}"

              if [[ "${processed}" == "0" ]]; then
                echo "READY_QUEUE=EMPTY"
                break
              fi
              if [[ "${outage}" == "true" ]]; then
                echo "Provider outage confirmed by multiple temporary AI failures; stop this drain and retry at the next scheduled window."
                break
              fi
            done
          }

          mode="${MANUAL_MODE:-}"
          if [[ -z "${mode}" || "${mode}" == "smart" ]]; then
            if [[ -n "${EVENT_SCHEDULE:-}" ]]; then
              mode="smart-hourly"
            else
              mode="smart-full"
            fi
          fi

          case "${mode}" in
            coverage)
              api_required "/api/coverage-import?source=all&limit=2000"

              drain_queue 300 coverage
              ;;
            news)
              api_required "/api/auto-publish?wait=1&scope=news&runner=github"
              ;;
            news-catchup)
              echo "===== NEWS BACKLOG CATCH-UP ====="
              for news_batch in 0 1 2 3 4 5 6; do
                echo "NEWS_FULL_BATCH=${news_batch}"
                api_required "/api/auto-publish?wait=1&scope=news&full=1&newsBatch=${news_batch}&newsBatchSize=4&runner=github"
                if [[ "${news_batch}" -lt 6 ]]; then
                  echo "Cooling down before the next News source batch..."
                  sleep 12
                fi
              done
              api_optional "/api/news-quality-repair?apply=1&limit=30"
              ;;
            news-repair)
              api_required "/api/news-quality-repair?apply=1&limit=30"
              ;;
            collect)
              # CA first: News can never prevent Current Affairs processing.
              api_required "/api/coverage-import?source=all&limit=2000"

              drain_queue 300 coverage
              api_optional "/api/auto-publish?wait=1&scope=news&runner=github"


              ;;
            queue)
              drain_queue
              ;;
            exams)
              api_required "/api/exams/run?full=1&notifications=0&runner=github"

              ;;
            smart-full)
              echo "===== FULL MANUAL CATCH-UP: CA FIRST ====="
              api_optional "/api/pipeline-recovery?apply=1"
              api_required "/api/coverage-import?source=all&limit=2000"

              drain_queue 420 coverage

              api_optional "/api/editorial-cleanup?apply=1&limit=120&days=365"
              api_optional "/api/quality-repair?apply=1&limit=120"

              for exam_batch in 0 1; do
                api_optional "/api/exams/run?full=1&examBatch=${exam_batch}&examBatchSize=6&notifications=0&runner=github"
              done

              api_optional "/api/generate-quiz?wait=1&force=1"

              # Use the scheduled News slice, not the historical full=1 call
              # that timed out before CA could run.
              api_optional "/api/auto-publish?wait=1&scope=news&runner=github"


              ;;
            smart-hourly)
              india_hour="$(TZ=Asia/Kolkata date +%H)"
              echo "INDIA_HOUR=${india_hour}"

              # Cheap self-heal for rows stranded by known historical pipeline regressions.
              if [[ "${india_hour}" == "06" || "${india_hour}" == "22" ]]; then
                api_optional "/api/pipeline-recovery?apply=1"
              fi

              # Coaching CA is first in the two evening publication windows.
              if [[ "${india_hour}" == "06" || "${india_hour}" == "12" || "${india_hour}" == "19" || "${india_hour}" == "22" ]]; then
                api_required "/api/auto-publish?wait=1&scope=coverage"

                drain_queue 300 coverage
              else
                # Current Affairs retains its durable AI retry queue.
                drain_queue 180 coverage
              fi

              # General News remains independent and lightweight.
              case "${india_hour}" in
                06|09|12|15|19|22)
                  api_optional "/api/auto-publish?wait=1&scope=news&runner=github"


                  ;;
              esac

              # ResultPulse official-source activity windows.
              case "${india_hour}" in
                06|12|19|22)
                  api_optional "/api/exams/run?notifications=0&runner=github"

                  ;;
              esac

              # Morning quiz plus a forced refresh after the late CA window.
              if [[ "${india_hour}" == "06" ]]; then
                api_optional "/api/generate-quiz?wait=1"

              elif [[ "${india_hour}" == "22" ]]; then
                api_optional "/api/generate-quiz?wait=1&force=1"

              fi

              # One daily archive cleanup after the collection windows.
              if [[ "${india_hour}" == "23" ]]; then
                api_optional "/api/editorial-cleanup?apply=1&limit=120&days=365"
                api_optional "/api/quality-repair?apply=1&limit=120"
              fi
              ;;
            *)
              echo "Unsupported mode: ${mode}"
              exit 2
              ;;
          esac

      - name: Print server log on automation failure
        if: failure()
        shell: bash
        run: cat /tmp/currentpulse-next.log || true

      - name: Stop local Next server
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/currentpulse-next.pid ]]; then
            kill "$(cat /tmp/currentpulse-next.pid)" 2>/dev/null || true
          fi

      - name: Check static-reader deploy readiness
        id: reader-deploy
        shell: bash
        run: |
          if [[ -n "${CLOUDFLARE_API_TOKEN:-}" && -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "ready=true" >> "${GITHUB_OUTPUT}"
          else
            echo "ready=false" >> "${GITHUB_OUTPUT}"
            echo "::warning title=Static reader deploy skipped::Content automation completed. Add CLOUDFLARE_API_TOKEN for unattended Cloudflare snapshot deployment."
          fi

      - name: Build validated reader release
        if: steps.reader-deploy.outputs.ready == 'true'
        run: npx opennextjs-cloudflare build

      - name: Start production reader renderer
        if: steps.reader-deploy.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npx next start --hostname 127.0.0.1 --port 3100 > /tmp/currentpulse-reader.log 2>&1 &
          echo $! > /tmp/currentpulse-reader.pid
          for attempt in {1..60}; do
            if curl --silent --fail --max-time 3 http://127.0.0.1:3100/icon.svg >/dev/null; then
              echo "Production reader renderer ready."
              exit 0
            fi
            sleep 2
          done
          cat /tmp/currentpulse-reader.log || true
          exit 1

      - name: Materialize public reader into Cloudflare Static Assets
        if: steps.reader-deploy.outputs.ready == 'true'
        run: node scripts/materialize-static-reader.mjs --base http://127.0.0.1:3100 --reuse-base https://cp.vliab.workers.dev --fresh-days 3 --out .open-next/assets --max-pages 1200 --concurrency 3 --timeout-ms 10000 --budget-seconds 720

      - name: Stop production reader renderer
        if: always() && steps.reader-deploy.outputs.ready == 'true'
        shell: bash
        run: |
          if [[ -f /tmp/currentpulse-reader.pid ]]; then
            kill "$(cat /tmp/currentpulse-reader.pid)" 2>/dev/null || true
          fi

      - name: Validate static-reader deploy credentials
        if: steps.reader-deploy.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]] || { echo "::error title=Cloudflare deploy blocked::Add repository secret CLOUDFLARE_API_TOKEN."; exit 1; }
          [[ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]] || { echo "::error title=Cloudflare deploy blocked::Add repository secret CLOUDFLARE_ACCOUNT_ID."; exit 1; }

      - name: Deploy refreshed static reader
        if: steps.reader-deploy.outputs.ready == 'true'
        run: npx wrangler deploy --config wrangler.jsonc

      - name: Verify refreshed reader
        if: steps.reader-deploy.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          base="https://cp.vliab.workers.dev"
          for path in / /current-affairs /news /exams /quiz /feed.xml /currentpulse-static-reader-manifest.json; do
            echo "Checking ${base}${path}"
            curl --silent --show-error --fail --location --retry 3 --retry-delay 2 --max-time 60 "${base}${path}" >/dev/null
          done
