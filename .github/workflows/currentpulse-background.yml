name: CurrentPulse Background Automation

on:
  schedule:
    # Hourly runner at :30 IST. Expensive collectors still run only in their
    # selected windows; the hourly cadence mainly drains AI fallbacks quickly.
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Automation task to run"
        required: true
        default: "smart"
        type: choice
        options:
          - smart
          - collect
          - news
          - coverage
          - queue
          - exams

permissions:
  contents: read

concurrency:
  group: currentpulse-background-automation
  cancel-in-progress: false

env:
  CRON_SECRET: currentpulse-github-actions-local-runner
  NEXT_PUBLIC_BASE_URL: https://currentpulse-ai.vercel.app

  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
  CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
  SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_AI_API_TOKEN: ${{ secrets.CLOUDFLARE_AI_API_TOKEN }}
  CP_GH_MODELS_TOKEN: ${{ secrets.CP_GH_MODELS_TOKEN }}

  RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
  RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
  WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
  WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
  WHATSAPP_TEMPLATE_NAME: ${{ secrets.WHATSAPP_TEMPLATE_NAME }}
  WHATSAPP_TEMPLATE_LANGUAGE: ${{ secrets.WHATSAPP_TEMPLATE_LANGUAGE }}

  NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}

  NEWS_CORE_SOURCES_PER_RUN: "4"
  NEWS_SUPPLEMENTAL_SOURCES_PER_RUN: "2"
  NEWS_FETCH_TIMEOUT_MS: "8000"
  NEWS_MAX_QUEUE_WRITES_PER_RUN: "36"
  AI_AUTOMATION_SOURCE_CHAR_LIMIT: "14000"

  # 8 configured coaching sources are covered by two complementary 4-source
  # evening windows. The direct inline cap is NOT the total publish cap: the
  # queue is drained repeatedly immediately after collection.
  COVERAGE_SOURCES_PER_RUN: "4"
  COVERAGE_IMMEDIATE_MAX_PER_RUN: "10"
  COVERAGE_IMMEDIATE_PUBLISH_BUDGET_MS: "150000"

  AI_PROVIDER_ORDER: "mistral,cloudflare,groq,openrouter,cerebras,sambanova,githubmodels,huggingface"
  AI_ROUTER_DEADLINE_MS: "50000"
  AI_PROVIDER_TIMEOUT_MS: "15000"
  GEMINI_REQUEST_TIMEOUT_MS: "15000"

  EXAM_SOURCES_PER_RUN: "5"
  EXAM_ITEMS_PER_SOURCE: "50"

jobs:
  automate:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.AUTOMATION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Use Node 24 with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${NEXT_PUBLIC_SUPABASE_URL:-}" ]] || { echo "Missing NEXT_PUBLIC_SUPABASE_URL"; exit 1; }
          [[ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ]] || { echo "Missing SUPABASE_SERVICE_ROLE_KEY"; exit 1; }

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Start private local Next server
        shell: bash
        run: |
          set -euo pipefail
          npm run dev -- --hostname 127.0.0.1 --port 3000 > /tmp/currentpulse-next.log 2>&1 &
          echo $! > /tmp/currentpulse-next.pid

          for attempt in {1..45}; do
            if curl --silent --fail --max-time 3 http://127.0.0.1:3000/icon.svg >/dev/null; then
              echo "CurrentPulse automation server ready."
              exit 0
            fi
            sleep 2
          done

          cat /tmp/currentpulse-next.log || true
          exit 1

      - name: Run CurrentPulse automation
        shell: bash
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          MANUAL_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail

          mark_deploy() {
            touch /tmp/currentpulse-deploy-needed
          }

          api_required() {
            local path="$1"
            echo
            echo ">>> ${path}"
            curl --silent --show-error --fail-with-body --max-time 300 \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              "http://127.0.0.1:3000${path}"
            echo
          }

          api_optional() {
            local path="$1"
            echo
            echo ">>> OPTIONAL ${path}"
            if ! curl --silent --show-error --fail-with-body --max-time 300 \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              "http://127.0.0.1:3000${path}"; then
              echo
              echo "Optional task failed; independent pipelines will continue."
              return 0
            fi
            echo
          }

          drain_queue() {
            local max_seconds="${1:-900}"
            local started batch tmp code curl_status processed outage
            started="$(date +%s)"
            echo
            echo "===== DRAIN READY QUEUE (${max_seconds}s budget) ====="

            for batch in $(seq 1 60); do
              if (( $(date +%s) - started >= max_seconds )); then
                echo "Queue drain reached its safety budget."
                break
              fi

              tmp="$(mktemp)"
              set +e
              code="$(
                curl --silent --show-error --max-time 135 \
                  --output "${tmp}" \
                  --write-out "%{http_code}" \
                  -H "Authorization: Bearer ${CRON_SECRET}" \
                  "http://127.0.0.1:3000/api/process-queue?wait=1&limit=2"
              )"
              curl_status=$?
              set -e

              cat "${tmp}" || true
              echo

              if [[ "${curl_status}" -ne 0 ]]; then
                rm -f "${tmp}"
                echo "Queue processor request timed out/failed; rows remain durable for the next hourly retry."
                break
              fi

              if [[ "${code}" -lt 200 || "${code}" -ge 300 ]]; then
                rm -f "${tmp}"
                echo "Queue processor HTTP ${code}; rows remain durable for the next hourly retry."
                break
              fi

              processed="$(
                node -e '
                  const fs=require("fs");
                  const p=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
                  process.stdout.write(String(p?.stats?.processed || 0));
                ' "${tmp}"
              )"
              outage="$(
                node -e '
                  const fs=require("fs");
                  const p=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
                  process.stdout.write(p?.stats?.providerOutage ? "true" : "false");
                ' "${tmp}"
              )"
              rm -f "${tmp}"

              echo "QUEUE_BATCH=${batch} PROCESSED=${processed} PROVIDER_OUTAGE=${outage}"

              if [[ "${processed}" != "0" ]]; then
                mark_deploy
              fi
              if [[ "${processed}" == "0" ]]; then
                echo "READY_QUEUE=EMPTY"
                break
              fi
              if [[ "${outage}" == "true" ]]; then
                echo "Provider outage detected; retry on the next hourly run."
                break
              fi
            done
          }

          mode="${MANUAL_MODE:-}"
          if [[ -z "${mode}" || "${mode}" == "smart" ]]; then
            if [[ -n "${EVENT_SCHEDULE:-}" ]]; then
              mode="smart-hourly"
            else
              mode="smart-full"
            fi
          fi

          case "${mode}" in
            coverage)
              api_required "/api/coverage-import?source=all&limit=2000"
              mark_deploy
              drain_queue
              ;;
            news)
              api_required "/api/auto-publish?scope=news&runner=github"
              sleep 25
              mark_deploy
              drain_queue
              ;;
            collect)
              # CA first: News can never prevent Current Affairs processing.
              api_required "/api/coverage-import?source=all&limit=2000"
              mark_deploy
              drain_queue
              api_optional "/api/auto-publish?scope=news&runner=github"
              sleep 25
              mark_deploy
              drain_queue
              ;;
            queue)
              drain_queue
              ;;
            exams)
              api_required "/api/exams/run?full=1&notifications=0&runner=github"
              mark_deploy
              ;;
            smart-full)
              echo "===== FULL MANUAL CATCH-UP: CA FIRST ====="
              api_required "/api/coverage-import?source=all&limit=2000"
              mark_deploy
              drain_queue 1500

              api_optional "/api/editorial-cleanup?apply=1&limit=3000&days=365"
              mark_deploy

              api_optional "/api/exams/run?full=1&notifications=0&runner=github"
              mark_deploy

              api_optional "/api/generate-quiz?wait=1&force=1"
              mark_deploy

              # Use the scheduled News slice, not the historical full=1 call
              # that timed out before CA could run.
              api_optional "/api/auto-publish?scope=news&runner=github"
              sleep 25
              mark_deploy
              drain_queue 600
              ;;
            smart-hourly)
              india_hour="$(TZ=Asia/Kolkata date +%H)"
              echo "INDIA_HOUR=${india_hour}"

              # Coaching CA is first in the two evening publication windows.
              if [[ "${india_hour}" == "19" || "${india_hour}" == "22" ]]; then
                api_required "/api/auto-publish?wait=1&scope=coverage"
                mark_deploy
                drain_queue 1200
              else
                # Pending CA/News AI fallbacks are checked every hour.
                drain_queue 720
              fi

              # General News remains independent and lightweight.
              case "${india_hour}" in
                06|09|12|15|19|22)
                  api_optional "/api/auto-publish?scope=news&runner=github"
              sleep 25
                  mark_deploy
                  drain_queue
                  ;;
              esac

              # ResultPulse official-source activity windows.
              case "${india_hour}" in
                06|12|19|22)
                  api_optional "/api/exams/run?notifications=0&runner=github"
                  mark_deploy
                  ;;
              esac

              # Morning quiz plus a forced refresh after the late CA window.
              if [[ "${india_hour}" == "06" ]]; then
                api_optional "/api/generate-quiz?wait=1"
                mark_deploy
              elif [[ "${india_hour}" == "22" ]]; then
                api_optional "/api/generate-quiz?wait=1&force=1"
                mark_deploy
              fi

              # One daily archive cleanup after the collection windows.
              if [[ "${india_hour}" == "23" ]]; then
                api_optional "/api/editorial-cleanup?apply=1&limit=3000&days=365"
                mark_deploy
              fi
              ;;
            *)
              echo "Unsupported mode: ${mode}"
              exit 2
              ;;
          esac

      - name: Print server log on automation failure
        if: failure()
        shell: bash
        run: cat /tmp/currentpulse-next.log || true

      - name: Stop local Next server
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/currentpulse-next.pid ]]; then
            kill "$(cat /tmp/currentpulse-next.pid)" 2>/dev/null || true
          fi

      - name: Deploy refreshed Cloudflare static snapshot
        if: always()
        continue-on-error: true
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -u
          if [[ ! -f /tmp/currentpulse-deploy-needed ]]; then
            echo "No public-content change detected; deployment skipped."
            exit 0
          fi
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "Cloudflare deployment credentials unavailable; DB updates remain saved."
            exit 0
          fi
          npm run deploy
