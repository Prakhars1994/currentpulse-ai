name: CurrentPulse Background Automation

# Current Affairs and News are administrator-published only. This workflow is
# intentionally limited to ResultPulse official exam updates. It must never
# collect coaching CA, newspapers/RSS, run the article AI queue, or repair
# administrator PDF content.
on:
  schedule:
    - cron: "0 1 * * *"   # 06:30 IST
    - cron: "0 7 * * *"   # 12:30 IST
    - cron: "0 14 * * *"  # 19:30 IST
    - cron: "0 17 * * *"  # 22:30 IST
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: currentpulse-background-automation
  cancel-in-progress: false

env:
  CRON_SECRET: ${{ secrets.CRON_SECRET }}
  NEXT_PUBLIC_BASE_URL: https://cp.vliab.workers.dev
  NEXT_PUBLIC_SITE_URL: https://cp.vliab.workers.dev
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  EXAM_SOURCES_PER_RUN: "6"
  EXAM_ITEMS_PER_SOURCE: "50"

jobs:
  automate:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Use Node 24 with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${CRON_SECRET:-}" ]] || { echo "Missing CRON_SECRET"; exit 1; }
          [[ -n "${NEXT_PUBLIC_SUPABASE_URL:-}" ]] || { echo "Missing NEXT_PUBLIC_SUPABASE_URL"; exit 1; }
          [[ -n "${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}" ]] || { echo "Missing NEXT_PUBLIC_SUPABASE_ANON_KEY"; exit 1; }
          [[ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ]] || { echo "Missing SUPABASE_SERVICE_ROLE_KEY"; exit 1; }

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Restore validated runtime snapshot
        uses: actions/cache/restore@v4
        with:
          path: |
            .next
            .open-next
          key: currentpulse-runtime-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            currentpulse-release-${{ github.sha }}-

      - name: Capture public release state
        id: release-before
        shell: bash
        run: |
          set +e
          fingerprint="$(node scripts/public-release-state.mjs --fingerprint-only 2>/tmp/currentpulse-release-before.err)"
          status=$?
          set -e
          if [[ "${status}" -ne 0 || -z "${fingerprint}" ]]; then
            cat /tmp/currentpulse-release-before.err || true
            fingerprint="unknown-before-${GITHUB_RUN_ID}"
          fi
          echo "fingerprint=${fingerprint}" >> "${GITHUB_OUTPUT}"

      - name: Start private local Next server
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f .next/BUILD_ID ]]; then
            npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/currentpulse-next.log 2>&1 &
          else
            npm run dev -- --hostname 127.0.0.1 --port 3000 > /tmp/currentpulse-next.log 2>&1 &
          fi
          echo $! > /tmp/currentpulse-next.pid

          for attempt in {1..45}; do
            if curl --silent --fail --max-time 3 http://127.0.0.1:3000/icon.svg >/dev/null; then
              echo "CurrentPulse ResultPulse runner ready."
              exit 0
            fi
            sleep 2
          done

          cat /tmp/currentpulse-next.log || true
          exit 1

      - name: Refresh ResultPulse official exam updates
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --fail-with-body --max-time 900 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "http://127.0.0.1:3000/api/exams/run?notifications=0&runner=github"
          echo

      - name: Print server log on failure
        if: failure()
        shell: bash
        run: cat /tmp/currentpulse-next.log || true

      - name: Stop local Next server
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/currentpulse-next.pid ]]; then
            kill "$(cat /tmp/currentpulse-next.pid)" 2>/dev/null || true
          fi

      - name: Detect public content changes
        id: release-change
        if: always()
        shell: bash
        run: |
          set +e
          after="$(node scripts/public-release-state.mjs --fingerprint-only 2>/tmp/currentpulse-release-after.err)"
          status=$?
          set -e
          before="${{ steps.release-before.outputs.fingerprint }}"

          if [[ "${status}" -ne 0 || -z "${after}" ]]; then
            cat /tmp/currentpulse-release-after.err || true
            echo "changed=true" >> "${GITHUB_OUTPUT}"
            echo "Release-state check failed; fail-safe reader refresh requested."
          elif [[ "${before}" != "${after}" ]]; then
            echo "changed=true" >> "${GITHUB_OUTPUT}"
            echo "Public ResultPulse content changed: ${before} -> ${after}"
          else
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "No public content changed; no reader release is required."
          fi

      - name: Request incremental reader release
        if: always() && steps.release-change.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run "currentpulse-reader-release.yml" \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            -f reason="resultpulse-${GITHUB_RUN_ID}" \
            -f expected_sha="${GITHUB_SHA}"
